# ============================================================
# TinyTroupe 配置覆盖文件
# 放在项目根目录，TinyTroupe 启动时会自动读取并覆盖默认值
# ============================================================

[OpenAI]
# 使用 OpenAI 兼容网关时保持 openai
API_TYPE=openai

# 模型名（按你的网关支持情况修改，常见：gpt-4o-mini / deepseek-chat / glm-4-flash 等）
MODEL=deepseek-v4-flash

# DeepSeek 思考模式（OpenAI 兼容格式）
# 文档：https://api-docs.deepseek.com/zh-cn/guides/thinking_mode
# 仅当 MODEL 以 deepseek 开头时生效
DEEPSEEK_THINKING_ENABLED=False
# 可选：high / max；兼容值 low / medium 会映射为 high，xhigh 会映射为 max
DEEPSEEK_THINKING_EFFORT=heigh

# 视觉模型（与 MODEL 相同即可，本 MVP 基本流程不依赖视觉）
VISION_MODEL=gpt-4o-mini
VISION_DETAIL=auto

# Embedding 模型（仅 read_documents 时使用，基本流程不触发）
EMBEDDING_MODEL=text-embedding-3-small

MAX_COMPLETION_TOKENS=2048
TEMPERATURE=0.8
TIMEOUT=120
MAX_ATTEMPTS=3
WAITING_TIME=0
EXPONENTIAL_BACKOFF_FACTOR=3

# 并发数量
MAX_CONCURRENT_MODEL_CALLS=5

# 关闭 API 调用缓存，保证每次分析都是真实调用（如需提速可改 True）
CACHE_API_CALLS=False
CACHE_FILE_NAME=tinytroupe_cache.json

[Simulation]
PARALLEL_AGENT_GENERATION=True
PARALLEL_AGENT_ACTIONS=True

[Cognition]
ENABLE_MEMORY_CONSOLIDATION=False
MIN_EPISODE_LENGTH=5
MAX_EPISODE_LENGTH=30
EPISODIC_MEMORY_FIXED_PREFIX_LENGTH=5
EPISODIC_MEMORY_LOOKBACK_LENGTH=10

[ActionGenerator]
MAX_ATTEMPTS=2
ENABLE_QUALITY_CHECKS=False
ENABLE_REGENERATION=False
ENABLE_DIRECT_CORRECTION=False
CONTINUE_ON_FAILURE=True
QUALITY_THRESHOLD=2

[Logging]
LOGLEVEL=ERROR
LOGLEVEL_CONSOLE=ERROR
LOG_INCLUDE_THREAD_ID=False
